{% extends 'base.html' %}
{% load static %}

{% block title %}Entrar no Sistema{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-body p-5 text-center">
                    
                    <img src="{% static 'img/brasao-uft.png' %}" alt="UFT" class="mb-4" style="width: 100px;">
                    
                    <h4 class="text-uft fw-bold mb-4">Acesso ao Sistema</h4>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="text-start">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Usuário</label>
                                <input type="text" name="username" class="form-control" placeholder="Seu usuário" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Senha</label>
                                <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn bg-uft text-white btn-lg fw-bold">Entrar</button>
                        </div>
                    </form>

                    <div class="mt-4">
                        <p class="text-muted small">Ainda não tem conta? <a href="{% url 'cadastro' %}" class="text-uft fw-bold">Cadastre-se</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
